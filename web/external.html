<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- The chat page for the "external" access role, served by /studio: a plain web app around the assistant, with a
     "how this answer was produced" panel. It runs the customer app's script (mobile.js) for the chat, voice input,
     history, suggestions and feedback, but none of that app's chrome; conversations are tagged "external". -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok Bank Assistant</title>
<link rel="stylesheet" href="/static/mobile.css">
<link rel="stylesheet" href="/static/external.css">
</head>
<body class="webapp" data-source="external">
<header class="wa-top">
  <div class="wa-brand"><span class="ai-av"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></span><h1 id="title">Assistant</h1><span class="wa-sub">Bangkok Bank product assistant</span></div>
  <div class="wa-user" id="topnav">
    <button class="icon-btn" id="btn-history" aria-label="Conversations" title="Conversations"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
    <button class="avatar" id="avatar" aria-label="Account">PW</button>
    <a href="/.auth/logout?post_logout_redirect_uri=/" class="tn-btn" id="tn-signout" hidden>Sign out</a>
  </div>
  <div class="account" id="account" hidden>
    <div class="acc-name" id="acc-name">…</div>
    <div class="acc-email" id="acc-email"></div>
    <a class="acc-signout" id="acc-signout" href="/.auth/logout?post_logout_redirect_uri=/" hidden>Sign out of Microsoft</a>
  </div>
</header>

<div class="wa-layout">
  <main class="wa-main">
    <div class="body" id="body"></div>
    <div class="composer">
      <div class="card">
        <input id="input" placeholder="Ask anything" autocomplete="off">
        <div class="btns">
          <span class="wa-spacer"></span>
          <button class="mic" id="btn-mic" aria-label="Voice input" title="Voice input"><span class="ring"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
          <button class="rbtn send" id="btn-send" aria-label="Send" title="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
        </div>
      </div>
      <div class="foot">Powered by AI, double-check the responses</div>
    </div>
    <div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
  </main>
  <aside class="devpanel" id="devpanel">
    <div class="dp-head"><b>How the answer was produced</b><span class="muted" id="dp-session"></span><button id="dp-toggle" class="dp-btn" title="hide this panel">hide</button></div>
    <div id="dp-log" class="dp-log"><div class="dp-empty">Send a message to see routing, retrieval, tokens, cost and sources.</div></div>
  </aside>
</div>
<button id="dp-show" class="dp-show" hidden>show details</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script src="/static/trace.js"></script>
<script src="/static/mobile.js"></script>
</body>
</html>
