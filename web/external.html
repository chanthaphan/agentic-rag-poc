<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- The page for the "external" access role, served at / (in place of the customer app; /studio refuses the role). Its own design and script, separate from the customer
     app: a workspace with a conversation list, a transcript column, voice input, and a "how this answer was produced"
     block under each answer. Conversations are tagged "external" so Studio can filter them. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Assistant</title>
<link rel="stylesheet" href="/static/external.css">
</head>
<body>
<div class="ws">
  <aside class="side" id="side">
    <div class="side-brand">
      <span class="mark">PA</span>
      <div><b>Product Assistant</b><small id="brand-sub">Bangkok Bank products</small></div>
      <button class="side-close" id="side-close" aria-label="Close menu">&times;</button>
    </div>
    <button class="new-btn" id="btn-new">+ New conversation</button>
    <div class="side-label" id="side-label">Your conversations</div>
    <nav class="convs" id="convs"><div class="convs-empty">No conversations yet</div></nav>
    <div class="side-user">
      <span class="initials" id="u-initials">…</span>
      <div class="side-user-text"><b id="u-name">…</b><small id="u-email"></small></div>
      <a id="u-signout" class="signout" href="/.auth/logout?post_logout_redirect_uri=/" hidden title="Sign out">Sign out</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="bar-title" id="bar-title">New conversation</div>
      <div class="lang" id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="th">ไทย</button></div>
      <label class="switch" id="details-switch" title="Show how each answer was produced"><input type="checkbox" id="show-details"><span id="details-lbl">Show details</span></label>
    </header>

    <div class="scroll" id="scroll">
      <div class="col" id="col"></div>
    </div>

    <footer class="ask">
      <div class="ask-box">
        <textarea id="q" rows="1" placeholder="Ask about a Bangkok Bank product"></textarea>
        <div class="ask-btns">
          <button class="mic" id="btn-mic" aria-label="Speak your question" title="Speak your question"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
          <button class="send" id="btn-send" aria-label="Send" title="Send (Enter)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
        </div>
      </div>
      <div class="ask-hint"><span id="mic-hint">Enter to send · Shift+Enter for a new line</span><span id="ai-hint">Answers are generated by AI. Please double-check important details.</span></div>
    </footer>
  </main>
</div>
<div class="side-bg" id="side-bg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script src="/static/trace.js"></script>
<script src="/static/external.js"></script>
</body>
</html>
