<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>bankrag Studio · sign in</title>
<link rel="stylesheet" href="/static/mobile.css"><link rel="stylesheet" href="/static/studio.css">
<style>.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--gray-20);border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(20,40,70,.08)} .login h1{font:var(--heading-sm);font-weight:600;margin:0 0 4px} .login p{color:var(--gray-60);font:var(--caption-lg);margin:0 0 16px} .err{color:var(--red-70);font:var(--caption-lg);margin-bottom:10px}</style>
</head><body class="studio">
<form class="login form" method="post" action="/studio/login">
  <h1>bankrag Studio</h1><p>Tester sign-in for skills, knowledge, evals and conversations.</p>
  <div class="err" id="err" hidden>Wrong password. Try again.</div>
  <label>Your name <small id="name-note">(any name; shown on feedback and conversations)</small><input name="tester" id="tester" placeholder="e.g. Pim" autocomplete="name"></label>
  <label>Studio password<input name="password" type="password" required autofocus autocomplete="current-password"></label>
  <div class="toolbar"><button type="submit">Sign in</button><a class="btn-secondary" href="/">Back to app</a></div>
</form>
<script>
if (location.search.includes("error=1")) document.getElementById("err").hidden = false;
fetch("/whoami", { credentials: "same-origin" }).then((r) => r.json()).then((w) => {
  const inp = document.getElementById("tester");
  if (w.sso && w.name) { inp.value = w.name; document.getElementById("name-note").textContent = `(signed in with Microsoft as ${w.email}; change it if you like)`; }
  else if (w.tester) inp.value = w.tester;
}).catch(() => {});
</script>
</body></html>
