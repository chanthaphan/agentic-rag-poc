<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok Bank Assistant</title>
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
<nav class="topnav" id="topnav"><a href="/studio" class="tn-btn">Studio</a><a href="/.auth/logout?post_logout_redirect_uri=/" class="tn-btn" id="tn-signout" hidden>Sign out</a></nav>
<div class="stage">
  <div class="phone-col">
  <div class="phone">
    <div class="island"></div>
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="icons">
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#0f2236"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#0f2236" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a10.5 10.5 0 0 1 14 0"/><path d="M4.2 7a6.5 6.5 0 0 1 8.6 0"/><path d="M7 9.7a2.6 2.6 0 0 1 3 0"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#0f2236" stroke-opacity=".35"/><rect x="2" y="2" width="19" height="9" rx="2" fill="#0f2236"/><path d="M24.5 4.5v4a2 2 0 0 0 0-4z" fill="#0f2236" fill-opacity=".4"/></svg>
      </span>
    </div>

    <div class="screen">
      <div class="hdr">
        <div class="hdr-row">
          <h1 id="title">Assistant</h1>
          <div class="hdr-right">
            <button class="icon-btn" id="btn-history" aria-label="History"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
            <div class="avatar" id="avatar">PW</div>
          </div>
        </div>
        <div class="dots"><i></i><i class="on"></i><i></i></div>
      </div>

      <div class="body" id="body"></div>

      <div class="composer">
        <div class="card">
          <input id="input" placeholder="Ask anything" autocomplete="off">
          <div class="btns">
            <button class="rbtn" id="btn-image" aria-label="Attach image" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19.5 3-3 3 3"/><path d="M17 22v-5.5"/><circle cx="9" cy="9" r="2"/></svg></button>
            <button class="mic" id="btn-mic" aria-label="Voice"><span class="ring"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
            <button class="rbtn send" id="btn-send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
          </div>
        </div>
        <div class="foot">Powered by AI, double-check the responses</div>
      </div>

    </div>

    <div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
    <div class="home"><span></span></div>
  </div>
  </div>
  <aside class="devpanel" id="devpanel">
    <div class="dp-head"><b>Behind the scenes</b><span class="muted" id="dp-session"></span><button id="dp-toggle" class="dp-btn" title="hide">hide</button></div>
    <div id="dp-log" class="dp-log"><div class="dp-empty">Send a message to see routing, agent, tool calls and sources.</div></div>
  </aside>
</div>
<button id="dp-show" class="dp-show" hidden>show log</button>
<div class="stage-note">POC · <a href="/legacy">debug view</a></div>

<script src="/static/mobile.js"></script>
</body>
</html>
