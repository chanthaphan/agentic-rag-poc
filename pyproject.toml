[project]
name = "bankrag"
version = "0.1.0"
description = "Bank product recommendation agent POC: Microsoft Foundry agents + Azure AI Search (Foundry IQ) with per-product skills"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.6.0",
    "azure-search-documents==12.1.0b2",
    "azure-identity>=1.25.0",
    "azure-core>=1.35.0",
    "openai>=3.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "tiktoken>=0.9",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=13.7",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
import = ["markdownify>=0.13", "beautifulsoup4>=4.12", "curl_cffi>=0.7"]

[project.scripts]
bankrag = "bankrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
prerelease = "allow"
